# Any CI that reviewdog supports (GitHub, GitLab, Gerrit, Bitbucket, Gitea): ProvenFlow writes
# rdjson, and reviewdog comments on the added lines with its own reporters.
name: ProvenFlow via reviewdog
on: pull_request
permissions: { contents: read, pull-requests: write }
jobs:
  provenflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: ProvenFlow
        run: |
          git clone --depth 1 https://github.com/belkassaby/provenflow.git "$RUNNER_TEMP/provenflow"
          (cd "$RUNNER_TEMP/provenflow" && npm ci --no-audit --no-fund -w @provenflow/language -w @provenflow/extract -w @provenflow/server && npm run build -w @provenflow/language && npm run build -w @provenflow/extract && npm run build -w @provenflow/server)
          node "$RUNNER_TEMP/provenflow/packages/server/out/cli.js" extract . --fail-on none -o provenflow-report
      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=rdjson -name=ProvenFlow -reporter=github-pr-review -filter-mode=added -fail-level=error < provenflow-report/report.rdjson
