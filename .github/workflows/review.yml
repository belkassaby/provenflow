name: ProvenFlow review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ProvenFlow reviews its own pull requests: findings on the changed lines, verified fixes as suggestions.
      - uses: ./
        with:
          fail-on: warning
          cbmc: 'true'
