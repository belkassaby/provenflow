group = io.github.belkassaby
version = 0.1.0

# The IDE the plugin is built against. -PplatformLocalPath=/Applications/IntelliJ IDEA.app builds
# against an installed IDE instead of downloading this version.
platformVersion = 2026.2.3

# The IDE bundles the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
